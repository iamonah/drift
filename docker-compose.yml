services:
  driftdb:
    image: postgres:18.3
    container_name: driftdb
    # restart: always
    environment:
      POSTGRES_USER: driftadmin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: drift
    ports:
      - "5432:5432"
    volumes:
      - drift-db-data:/var/lib/postgresql/

  testdb:
    image: postgres:18.3
    container_name: testdb
    # restart: always,
    profiles: ["test"]
    environment:
      POSTGRES_USER: drifttest
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: drift_test
    ports:
      - "5433:5432"
    volumes:
      - drift-db-testdata:/var/lib/postgresql/

  localstack:
    container_name: '${LOCALSTACK_DOCKER_NAME:-localstack-drift}'
    image: localstack/localstack
    ports:
      - '127.0.0.1:4566:4566' # LocalStack Gateway
      - '127.0.0.1:4510-4559:4510-4559' # external services port range
      - '127.0.0.1:443:443' # LocalStack HTTPS Gateway
    environment:
      # Activate LocalStack for AWS: https://docs.localstack.cloud/getting-started/auth-token/
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'

volumes:
  drift-db-data:
  drift-db-testdata:

networks:
  default:
    name: drift-network
