environment: development

database:
  host: localhost
  port: "5432"
  user: driftadmin
  password: secret
  name: drift
  ssl_mode: disable
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  max_conns: 25
  min_conns: 5

server:
  port: "8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  host: 127.0.0.1
  cors_allowed_origins:
    - http://localhost:3000
    - http://localhost:8080

worker:
  concurrency: 4

outbox:
  interval: 5s
  batch_size: 20
  concurrency: 4
  send_timeout: 10s
  claim_lease: 2m
  max_attempts: 10
  retry_base: 5s
  retry_max: 5m
  failure_threshold: 5 #represents consecutive failures where no single message was successfully sent
  cooldown: 15s

jwt:
  secret_key: secret
  issuer: drift
  audience: drift
  access_token_duration: 15m 
  refresh_token_duration: 7d

awssqs:
  queue_name: my-test-queue
  base_url: http://localhost:4566

awss3:
  bucket_name: my-test-bucket
  base_url: http://localhost:4566
  presign_expiration: 2m
