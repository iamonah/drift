environment: development

database:
  host: localhost
  port: "5432"
  user: driftadmin
  password: secret
  name: drift
  ssl_mode: disable
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  max_conns: 25
  min_conns: 5

server:
  port: "8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  cors_allowed_origins:
    - http://localhost:3000
    - http://localhost:8080

awssqs:
  region: us-east-1
  access_key_id: YOUR_AWS_ACCESS_KEY_ID
  secret_access_key: YOUR_AWS_SECRET_ACCESS_KEY

jwt:
  secret_key: ""
  issuer: drift
  audience: drift
  access_token_duration: 15m
  refresh_token_duration: 7d